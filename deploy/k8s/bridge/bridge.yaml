# Until Clickland runs in the cluster, these names point pods at Clickland on this machine (Docker compose project
# clickland-infra and the API/console dev servers), through OrbStack's host.orb.internal. Each port is the same on
# the host: the collector on 4317/4318, the API on 4710, the console on 4711. Landflow's orbstack-clickland overlay
# uses these names. Replace with the real Services when Clickland is deployed to clickland-dev.
apiVersion: v1
kind: Service
metadata:
  name: clickland-collector
  namespace: clickland-dev
spec:
  type: ExternalName
  externalName: host.orb.internal
  ports:
    - { name: otlp-grpc, port: 4317 }
    - { name: otlp-http, port: 4318 }
---
apiVersion: v1
kind: Service
metadata:
  name: clickland-api
  namespace: clickland-dev
spec:
  type: ExternalName
  externalName: host.orb.internal
  ports:
    - { name: http, port: 4710 }
---
apiVersion: v1
kind: Service
metadata:
  name: clickland-console
  namespace: clickland-dev
spec:
  type: ExternalName
  externalName: host.orb.internal
  ports:
    - { name: http, port: 4711 }
