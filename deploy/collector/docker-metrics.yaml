# clickland-docker-metrics: CPU, memory, network and block I/O of every container on this Docker engine (OrbStack),
# sent over OTLP to the main collector. It is a separate service because reading the Docker socket needs root; the
# main collector stays unprivileged. Kubernetes pods also run as containers on OrbStack, so they appear here too
# (labelled with their namespace and pod), next to the cluster-metrics collector's view of them.
receivers:
  docker_stats:
    endpoint: unix:///var/run/docker.sock
    collection_interval: 30s
    timeout: 20s
    container_labels_to_metric_labels:
      com.docker.compose.project: compose.project
      com.docker.compose.service: compose.service
      io.kubernetes.pod.namespace: k8s.namespace.name
      io.kubernetes.pod.name: k8s.pod.name
      io.kubernetes.container.name: k8s.container.name
    metrics:
      container.cpu.utilization:
        enabled: true
      container.memory.percent:
        enabled: true
      container.restarts:
        enabled: true
      container.uptime:
        enabled: true
      # The pause containers of k8s pods would double every pod; they are dropped below.

processors:
  filter/pause:
    error_mode: ignore
    metrics:
      metric:
        - 'IsMatch(resource.attributes["container.image.name"], ".*pause.*")'
  resource:
    attributes:
      - key: service.name
        value: docker
        action: upsert
      - key: host.name
        value: orbstack
        action: upsert
  batch:
    timeout: 10s

exporters:
  otlp_http:
    endpoint: http://collector:4318

service:
  telemetry:
    logs:
      level: warn
  pipelines:
    metrics:
      receivers: [docker_stats]
      processors: [filter/pause, resource, batch]
      exporters: [otlp_http]
