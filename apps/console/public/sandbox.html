<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Clickland MCP App sandbox</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: transparent; overflow: hidden; }
      iframe { display: block; width: 100%; height: 100%; border: 0; background: transparent; }
    </style>
  </head>
  <body>
    <script>
      /*
       * The MCP Apps sandbox proxy (spec 2026-01-26). The console loads this page from a different origin than its
       * own (localhost <-> 127.0.0.1), so an app inside can never reach the console's cookies or DOM. It waits for
       * the app's HTML from the host, puts it in an inner iframe under a strict CSP, and relays JSON-RPC between the
       * host and the app.
       */
      (function () {
        if (window.self === window.top) {
          document.body.textContent = 'This page only runs inside the Clickland console.';
          return;
        }
        var parentOrigin = '*';
        try {
          if (document.referrer) parentOrigin = new URL(document.referrer).origin;
        } catch (e) {}

        var inner = document.createElement('iframe');
        inner.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms');
        inner.setAttribute('title', 'MCP App');
        document.body.appendChild(inner);

        function cspFor(csp) {
          csp = csp || {};
          var res = (csp.resourceDomains || []).join(' ');
          var connect = (csp.connectDomains || []).join(' ');
          var frames = (csp.frameDomains || []).join(' ');
          return [
            "default-src 'none'",
            "script-src 'unsafe-inline' " + res,
            "style-src 'unsafe-inline' " + res,
            'img-src data: blob: ' + res,
            'font-src data: ' + res,
            'media-src data: blob: ' + res,
            'connect-src ' + (connect || "'none'"),
            'frame-src ' + (frames || "'none'"),
            "base-uri 'none'",
            "form-action 'none'",
          ].join('; ');
        }

        function withCsp(html, csp) {
          var meta = '<meta http-equiv="Content-Security-Policy" content="' + cspFor(csp).replace(/"/g, '&quot;') + '">';
          if (/<head[^>]*>/i.test(html)) return html.replace(/<head[^>]*>/i, function (m) { return m + meta; });
          return meta + html;
        }

        window.addEventListener('message', function (event) {
          var data = event.data;
          if (event.source === window.parent) {
            if (parentOrigin !== '*' && event.origin !== parentOrigin) return;
            if (data && data.method === 'ui/notifications/sandbox-resource-ready') {
              var params = data.params || {};
              if (typeof params.sandbox === 'string') inner.setAttribute('sandbox', params.sandbox);
              if (typeof params.html === 'string') inner.srcdoc = withCsp(params.html, params.csp);
              return;
            }
            if (inner.contentWindow) inner.contentWindow.postMessage(data, '*');
          } else if (event.source === inner.contentWindow) {
            window.parent.postMessage(data, parentOrigin);
          }
        });

        window.parent.postMessage({ jsonrpc: '2.0', method: 'ui/notifications/sandbox-proxy-ready', params: {} }, parentOrigin);
      })();
    </script>
  </body>
</html>
